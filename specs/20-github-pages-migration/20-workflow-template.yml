name: Check and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep this pnpm version aligned with package.json's packageManager field.
      - uses: pnpm/setup@v2
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false

      - uses: actions/configure-pages@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Add the project's test command here when it has one.
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
