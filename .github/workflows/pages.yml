name: Reusable SvelteKit Pages deployment

on:
  workflow_call:
    inputs:
      app-directory:
        type: string
        default: .
      package-manager:
        type: string
        required: true
      package-manager-version:
        type: string
        default: ''
      node-version:
        type: string
        required: true
      build-script:
        type: string
        default: build
      check-script:
        type: string
        default: ''
      test-script:
        type: string
        default: ''
      publish-directory:
        type: string
        default: build

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.app-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.package-manager-version }}
          run_install: false
      - name: Select declared npm version
        if: inputs.package-manager == 'npm' && inputs.package-manager-version != ''
        env:
          NPM_VERSION: ${{ inputs.package-manager-version }}
        run: npm install --global "npm@$NPM_VERSION"
      - name: Validate package manager
        env:
          MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$MANAGER" in npm|pnpm) ;; *) echo 'Only npm and pnpm are supported'; exit 1 ;; esac
      - uses: actions/configure-pages@v6
      - name: Install
        env:
          MANAGER: ${{ inputs.package-manager }}
        run: |
          if [ "$MANAGER" = pnpm ]; then pnpm install --frozen-lockfile; else npm ci; fi
      - name: Check
        if: inputs.check-script != ''
        env:
          MANAGER: ${{ inputs.package-manager }}
          SCRIPT: ${{ inputs.check-script }}
        run: '"$MANAGER" run "$SCRIPT"'
      - name: Test
        if: inputs.test-script != ''
        env:
          MANAGER: ${{ inputs.package-manager }}
          SCRIPT: ${{ inputs.test-script }}
        run: '"$MANAGER" run "$SCRIPT"'
      - name: Build
        env:
          MANAGER: ${{ inputs.package-manager }}
          SCRIPT: ${{ inputs.build-script }}
        run: '"$MANAGER" run "$SCRIPT"'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.app-directory }}/${{ inputs.publish-directory }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
